<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="HeeJung Kim’s eight-page Power BI Financial Report with report previews, downloads, and companion analysis.">
  <title>Power BI Financial Report | HeeJung Kim</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#report">Skip to report</a>
  <header class="header">
    <div class="wrap header-inner">
      <a class="brand" href="./"><span class="monogram" aria-hidden="true">HK</span><span>HeeJung Kim <span class="brand-sub">Financial Analytics</span></span></a>
      <a class="header-github" href="https://github.com/hjkim20022/power-bi-financial-analysis-portfolio">GitHub repository</a>
    </div>
  </header>
  <main class="wrap report" id="report">
    <div id="project-list"></div>
    <noscript>
      <h1>Power BI Financial Report</h1>
      <p><a href="reports/Original_PowerBI_Export.pdf">Open the eight-page PDF</a> · <a href="reports/HeeJung_Kim_Financial_Report.pbix" download>Download the Power BI file</a></p>
      <img src="assets/financial-report/06-dashboard.webp" alt="Power BI dashboard with revenue, profit, margins, assets, and liabilities">
    </noscript>
  </main>
  <dialog id="project-dialog" aria-labelledby="dialog-title">
    <div class="dialog-header">
      <div><span class="eyebrow" id="dialog-category"></span><h2 id="dialog-title"></h2></div>
      <button type="button" class="icon-button close-dialog" aria-label="Close project viewer" autofocus>×</button>
    </div>
    <div class="dialog-body">
      <div class="viewer">
        <div id="viewer-groups"></div>
        <div class="viewer-controls">
          <div class="viewer-pages">
            <button type="button" class="icon-button" id="previous-page" aria-label="Previous preview">‹</button>
            <span id="viewer-counter" aria-live="polite"></span>
            <button type="button" class="icon-button" id="next-page" aria-label="Next preview">›</button>
          </div>
          <div class="zoom-controls">
            <button type="button" id="zoom-out" class="icon-button" aria-label="Zoom out">−</button>
            <output id="zoom-level" aria-live="polite">100%</output>
            <button type="button" id="zoom-in" class="icon-button" aria-label="Zoom in">+</button>
            <button type="button" id="zoom-fit" class="small-button">Fit</button>
          </div>
        </div>
        <div id="viewer-stage" tabindex="0" role="region" aria-label="Project preview. Scroll to inspect when zoomed."><img id="viewer-image" alt=""></div>
        <div class="viewer-caption"><strong id="viewer-name"></strong><a id="full-image" target="_blank" rel="noopener noreferrer">Open full-size image</a></div>
        <p id="viewer-note" class="preview-caption viewer-note"></p>
        <div class="viewer-thumbnails" id="viewer-thumbnails" role="group" aria-label="Choose preview"></div>
      </div>
      <aside class="project-details">
        <h3>Business question</h3><p id="dialog-question"></p>
        <h3>Skills demonstrated</h3><div id="dialog-skills" class="tags"></div>
        <h3>What’s in the project</h3><ul id="dialog-details"></ul>
        <p class="evidence-note" id="dialog-evidence"></p>
        <div id="dialog-links" class="dialog-links"></div>
      </aside>
    </div>
  </dialog>
</body>
</html>
